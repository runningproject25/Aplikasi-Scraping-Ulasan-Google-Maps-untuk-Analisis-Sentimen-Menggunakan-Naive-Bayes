<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Saoenk Cobek Sentimen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center min-vh-100">

{% with messages = get_flashed_messages() %}
  {% for message in messages %}
    <div class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index:9999;min-width:320px;">
      <div class="alert alert-success fade show shadow text-center" role="alert">
        {{ message }}
      </div>
    </div>
  {% endfor %}
{% endwith %}

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card border-0 shadow-lg rounded-4 w-100">
        <div class="bg-danger text-white text-center p-4 rounded-top-4">
          <i class="fas fa-chart-pie fa-2x mb-2"></i>
          <h4 class="mb-0 fw-bold">Saoenk Cobek</h4>
          <small>Sistem Analisis Sentimen</small>
        </div>
        <div class="card-body p-4">
          {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
          {% endif %}
          <form method="POST">
            <div class="mb-3">
              <label class="form-label fw-semibold">Username</label>
              <input type="text" name="username" class="form-control" placeholder="Masukkan username" required autofocus>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Password</label>
              <input type="password" name="password" class="form-control" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn btn-danger w-100">
              <i class="fas fa-sign-in-alt me-2"></i>Masuk
            </button>
          </form>
          <div class="text-center mt-3">
            <small class="text-muted">
              Belum ada akun admin?
              <a href="{{ url_for('signup') }}" class="text-danger">Daftar di sini</a>
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  setTimeout(function () {
    var el = document.querySelector('.alert');
    if (el) bootstrap.Alert.getOrCreateInstance(el).close();
  }, 3000);
</script>
</body>
</html>
